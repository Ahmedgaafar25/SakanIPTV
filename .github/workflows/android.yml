name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"'
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testDebugUnitTest --no-daemon
      - name: Test bilingual interface and player features
        run: |
          npm ci --prefix tests --no-audit --no-fund
          npm --prefix tests test
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unsigned-apk-do-not-install-as-update
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: app/build/test-results/
